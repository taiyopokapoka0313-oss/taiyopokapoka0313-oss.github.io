<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アプリ一覧</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #fafafa;
    color: #2c2c2c;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    box-sizing: border-box;
  }
  main { max-width: 480px; text-align: center; }
  h1 { font-size: 1.6rem; margin-bottom: 1.5em; }
  .app-card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .app-card h2 { margin: 0 0 6px; font-size: 1.05rem; }
  .app-card span { color: #999; font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <h1>提供アプリ一覧</h1>

  <a class="app-card" href="https://apps.apple.com/app/id6804912131">
    <h2>QC検定®3級：資格試験対策【toppa】</h2>
    <span>App Store で見る →</span>
  </a>

  <a class="app-card" href="https://apps.apple.com/jp/developer/jin-nishio/id6790339308">
    <h2>その他のアプリ（FaceUP 他）</h2>
    <span>App Store デベロッパーページ →</span>
  </a>
</main>
</body>
</html>
